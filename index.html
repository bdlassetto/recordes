<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordes — BDL Pinheirinho</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <h1>Recordes BDL</h1>
  <p class="sub">Melhores tempos por pista e categoria</p>
</header>

<main>
  <div class="controls">
    <label for="categoria">Categoria</label>
    <select id="categoria"></select>
  </div>

  <div id="content"></div>

  <p id="updated" class="updated"></p>
</main>

<!-- ?v= sobe a cada mudanca em app.js/style.css. Sem isso o navegador
     reaproveita o JS antigo em cima do HTML novo: quando o seletor
     mudou de pista pra categoria, quem ja tinha visitado o site pegou
     JS velho procurando um elemento que nao existe mais e a pagina
     quebrava ("Cannot read properties of null"). -->
<script src="app.js?v=3"></script>
</body>
</html>
